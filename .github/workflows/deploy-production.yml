name: Publicar web en Sered
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - 'scripts/**'
      - '.github/workflows/deploy-production.yml'
permissions:
  contents: read
concurrency:
  group: sered-production
  cancel-in-progress: false
jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:seo
      - name: Publicar con respaldo y verificar portada
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-production.py
